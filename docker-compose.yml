name: local-build-platform

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-build_platform}
      MYSQL_USER: ${DB_USERNAME:-platform}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    # Loopback only: convenient for host tools, never exposed to the LAN.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    command: ["--default-time-zone=+00:00"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - lbp

  api:
    build:
      context: ./docker/php
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ./api:/var/www/html
      - composer_cache:/root/.composer/cache
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "REQUEST_METHOD=GET SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 600s
    networks:
      - lbp

  scheduler:
    build:
      context: ./docker/php
    restart: unless-stopped
    command: ["scheduler-start.sh"]
    working_dir: /var/www/html
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - ./api:/var/www/html
    depends_on:
      api:
        condition: service_healthy
    networks:
      - lbp

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # API entry point. Reachable from the Windows host as http://localhost:8100
      - "${NGINX_PORT:-8100}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api:/var/www/html:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - lbp

  web:
    build:
      context: ./docker/web
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      DEV_PORT: ${WEB_PORT:-5174}
      WEB_MODE: ${WEB_MODE:-dev}
      VITE_API_PROXY_TARGET: http://nginx:80
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      # Panel entry point. Reachable from the Windows host as http://localhost:5174
      - "${WEB_PORT:-5174}:${WEB_PORT:-5174}"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      nginx:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:$${DEV_PORT:-5174}/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    networks:
      - lbp

networks:
  lbp:
    driver: bridge

volumes:
  mysql_data:
  composer_cache:
  web_node_modules:
